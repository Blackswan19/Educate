eight: 110px; object-fit: cover; cursor: pointer; border-radius: 10px; } .icon-container { position: absolute; bottom: -10px; background: #00000082; padding: 5px 10px; transition: all 0.5s; opacity: 0; backdrop-filter: blur(30px); color: black; border-radius: 30px; justify-content: space-between; display: flex; align-items: center; gap: 20px; } .media-item:hover .icon-container { bottom: 5px; opacity: 1; } .icon-container a, .icon-container button { background-color: transparent; border: none; cursor: pointer; font-size: 15px; color: white; padding: 0; } .icon-container a:hover, .icon-container button:hover { color: #ffffff; } .icon-container button i.fa-solid.fa-circle-minus:hover { color: rgb(255, 11, 11); } .modal { display: none; position: fixed; z-index: 100000000; left: 0; top: 0; width: 100%; height: 100%; align-items: center; justify-content: center; overflow: hidden; opacity: 0; transition: opacity 0.3s ease-in-out; background: #000000ba; } .modal.show { display: flex; opacity: 1; } .modal-content { position: relative; width: 80%; height: 80%; display: flex ; justify-content: center; align-items: center; border-radius: 10px; padding: 20px; } .modal-content img, .modal-content video { max-width: 100%; max-height: 100%; object-fit: contain; } .close { position: absolute; top: 15px; right: 10px; color: white; font-size: 35px; background: #ffffff33; cursor: pointer; font-weight: 200; transition: color 0.2s ease-in-out; backdrop-filter: blur(30px); width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 50%; } .close:hover { color: #ffffff; } .modal-icon-container { position: absolute; border-radius: 42px; bottom: 15px; width: 100px; display: flex; justify-content: space-around; align-items: baseline; padding: 10px 0px; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0.1); } .rigthsideopt { font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0.1); width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 50%; padding: 2px; background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); } .modal-icon-container a, .modal-icon-container button { background-color: transparent; border: none; cursor: pointer; font-size: 15px; color: white; padding: 0; box-shadow: none; margin: 0; display: contents; } .modal-icon-container a:hover, .modal-icon-container button:hover { color: #ffffff; } .modal-icon-container button i.fa-solid.fa-circle-minus:hover { color: rgb(255, 11, 11); } .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 20px; cursor: pointer; transition: color 0.2s ease-in-out; z-index: 2; background: #ffffff1a; border-radius: 50%; width: 43px; height: 43px; display: flex; justify-content: center; align-items: center; padding: 5px; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0.1); } .nav.Me { color: #ffffff; } .nav-arrow.left { left: 10px; } .nav-arrow.right { right: 10px; } .mainoptions { display: flex; justify-content: center; gap: 5px; align-items: center; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; padding: 4px; } .custom-file-upload { color: white; padding: 5px; border-radius: 9999px; cursor: pointer; font-size: 16px; font-weight: 600; transition: transform 0.2s ease, box-shadow 0.2s ease; border: none; display: flex; justify-content: center; align-items: center; gap: 5px; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0); } .custom-file-upload i { margin-right: 10px; } button { border: none; padding: 6px 12px; border-radius: 51px; color: white; font-size: 16px; background: #0019f8; cursor: pointer; transition: transform 0.5s ease, box-shadow 0.5s ease, background 0.5s; border: 0.5px solid rgb(255 255 255 / 0%); } .logo img { width: 15%; } .inputs { position: fixed; bottom: 0; display: flex; gap: 15px; align-items: center; padding: 10px 10px 20px 10px; background: linear-gradient(0deg, black 50%, transparent); left: 0; justify-content: space-between; right: 0; z-index: 10000; } .media-item button { background: transparent; border: none; box-shadow: none; transition: none; transform: none; } .media-item button:hover{ background: none; background: transparent; border: none; box-shadow: none; transition: none; transform: none; } .topmain{ position: fixed; width: 100%; left: 0; font-size: 30px; font-weight: 800; z-index: 10000; top: 0; padding: 15px 10px; background: linear-gradient(180deg, black 50%, transparent); display: flex; justify-content: space-between; align-items: center; } @media screen and (max-width: 480px) { .logo img { width: 50%; } h1, h2 { color: #014dff; } .media-grid { grid-template-columns: repeat(2, 1fr); } .close { position: absolute; color: white; font-size: 30px; cursor: pointer; transition: color 0.2s ease-in-out; z-index: 1; } .modal-content img, .modal-content video { max-width: 90%; max-height: 100%; object-fit: contain; } .logo p { color: gray; font-weight: 600; font-size: 14px; margin-bottom: 45px; } } </style> </head> <body> <div class="topmain"> <div class="logo"> <h2>BsFilestore</h2> </div> <a href="https://blackswan19.github.io/bscrop/termsofuse" style="background: blue; color: white; border-radius: 999px; text-decoration: none; font-size: 15px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M10.95,13.07L9.36,11.47q-0.22-0.22-0.52-0.23T8.3,11.47T8.07,12.01T8.3,12.54l2.01,2.03q0.27,0.27 0.63,0.27t0.63-0.27l4.14-4.14q0.22-0.22 0.23-0.53T15.73,9.36T15.19,9.13T14.66,9.36l-3.71,3.71Zm0.74,8.28q-0.15-0.02-0.29-0.07q-3.16-1.13-5.03-3.99T4.5,11.1V6.6q0-0.57 0.33-1.02T5.68,4.91l5.69-2.12Q11.69,2.67 12,2.67t0.63,0.12l5.69,2.12q0.52,0.21 0.85,0.66T19.5,6.6v4.5q0,3.32-1.87,6.18T12.6,21.27q-0.14,0.05-0.29,0.07T12,21.37t-0.31-0.02Z"/></svg> </a> </div> </div> <div id="mediaContainer"></div> <div id="previewModal" class="modal"> <span class="close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-437.85 277.08-234.92q-8.31 8.3-20.89 8.5-12.57.19-21.27-8.5-8.69-8.7-8.69-21.08 0-12.38 8.69-21.08L437.85-480 234.92-682.92q-8.3-8.31-8.5-20.89-.19-12.57 8.5-21.27 8.7-8.69 21.08-8.69 12.38 0 21.08 8.69L480-522.15l202.92-202.93q8.31-8.3 20.89-8.5 12.57-.19 21.27 8.5 8.69 8.7 8.69 21.08 0 12.38-8.69 21.08L522.15-480l202.93 202.92q8.3 8.31 8.5 20.89.19 12.57-8.5 21.27-8.7 8.69-21.08 8.69-12.38 0-21.08-8.69L480-437.85Z"/></svg></span> <span class="nav-arrow left" onclick="navigateMedia(-1)"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m382-480 294 294q15 15 14.5 35T675-116q-15 15-35 15t-35-15L297-423q-12-12-18-27t-6-30q0-15 6-30t18-27l308-308q15-15 35.5-14.5T676-844q15 15 15 35t-15 35L382-480Z"/></svg></span> <div class="modal-content" id="modalContent"></div> <div class="modal-icon-container" id="modalIconContainer"></div> <span class="nav-arrow right" onclick="navigateMedia(1)"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M579-480 285-774q-15-15-14.5-35.5T286-845q15-15 35.5-15t35.5 15l307 308q12 12 18 27t6 30q0 15-6 30t-18 27L356-115q-15 15-35 14.5T286-116q-15-15-15-35.5t15-35.5l293-293Z"/></svg></span> </div> <div class="inputs"> <div class="mainoptions"> <label for="fileInput" class="custom-file-upload"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Zm200-486-75 75q-12 12-28.5 11.5T308-572q-11-12-11.5-28t11.5-28l144-144q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l144 144q12 12 11.5 28T652-572q-12 12-28.5 12.5T595-571l-75-75v286q0 17-11.5 28.5T480-320q-17 0-28.5-11.5T440-360v-286Z"/></svg> Upload </label> <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display: none;"> <button onclick="saveMedia()">Save</button> </div> <div class="rigthsideopt"> <a href="https://blackswan19.github.io/Educate/foldstore"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M172.31-180Q142-180 121-201q-21-21-21-51.31v-455.38Q100-738 121-759q21-21 51.31-21H362q14.46 0 27.81 5.62 13.34 5.61 23.19 15.46L471.92-700h315.77Q818-700 839-679q21 21 21 51.31v375.38Q860-222 839-201q-21 21-51.31 21H172.31Zm0-60h615.38q5.39 0 8.85-3.46t3.46-8.85v-375.38q0-5.39-3.46-8.85t-8.85-3.46H447.38l-76.53-76.54q-1.93-1.92-4.04-2.69-2.12-.77-4.43-.77H172.31q-5.39 0-8.85 3.46t-3.46 8.85v455.38q0 5.39 3.46 8.85t8.85 3.46ZM160-240v-480 480Z"/></svg></a> </div> </div>
<script>
        let currentMediaIndex = -1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('BsMediaStorage', 1);

                request.onupgradeneeded = function(event) {
                    db = event.target.result;
                    db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
                };

                request.onsuccess = function(event) {
                    db = event.target.result;
                    resolve(db);
                };

                request.onerror = function(event) {
                    reject('Failed to open IndexedDB: ' + event.target.error);
                };
            });
        }

        function loadMediaList() {
            return new Promise((resolve, reject) => {
                if (!db) {
                    initDB().then(() => loadMediaList()).then(resolve).catch(reject);
                    return;
                }

                const transaction = db.transaction(['media'], 'readonly');
                const store = transaction.objectStore('media');
                const request = store.getAll();

                request.onsuccess = function() {
                    let mediaList = request.result;
                    const legacyData = JSON.parse(localStorage.getItem('mediaList') || '[]');
                    if (legacyData.length > 0) {
                        const migrationPromises = legacyData.map(item => {
                            const mediaObj = typeof item === 'string' ? {
                                date: new Date().toISOString().split('T')[0],
                                data: item,
                                originalName: 'legacy_file_' + Math.random().toString(36).substr(2, 9)
                            } : item;
                            return addMediaToDB(mediaObj);
                        });

                        Promise.all(migrationPromises).then(() => {
                            localStorage.removeItem('mediaList');
                            loadMediaList().then(resolve).catch(reject);
                        }).catch(reject);
                    } else {
                        resolve(mediaList);
                    }
                };

                request.onerror = function() {
                    reject('Failed to load media: ' + request.error);
                };
            });
        }
        function addMediaToDB(mediaObj) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['media'], 'readwrite');
                const store = transaction.objectStore('media');
                const request = store.add(mediaObj);

                request.onsuccess = function() {
                    resolve();
                };

                request.onerror = function() {
                    reject('Failed to save media: ' + request.error);
                };
            });
        }
        function deleteMediaFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['media'], 'readwrite');
                const store = transaction.objectStore('media');
                const request = store.delete(id);

                request.onsuccess = function() {
                    resolve();
                };

                request.onerror = function() {
                    reject('Failed to delete media: ' + request.error);
                };
            });
        }

        function formatDate(isoDate) {
            const [year, month, day] = isoDate.split('-');
            return `${day}/${month}/${year}`;
        }

        function saveMedia() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;

            if (files.length === 0) {
                alert('Select files to upload.');
                return;
            }

            const maxSizeKB = 3500;
            const allowedTypes = [
                'image/jpeg', 'image/png', 'image/gif', 'image/webp',
                'video/mp4', 'video/webm', 'video/ogg'
            ];
            const uploadDate = new Date().toISOString().split('T')[0];
            const failedFiles = [];
            const promises = Array.from(files).map(file => {
                return new Promise((resolve, reject) => {
                    if (file.size > maxSizeKB * 10000000) {
                        failedFiles.push(`${file.name}, File is exceeding ${maxSizeKB}kb.Use BsImgediter to compress the size`);
                        resolve(null);
                        return;
                    }

                    if (!allowedTypes.includes(file.type)) {
                        failedFiles.push(`${file.name}: Unsupported file type (${file.type || 'unknown'}).`);
                        resolve(null);
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = () => resolve({
                        date: uploadDate,
                        data: reader.result,
                        originalName: file.name,
                        timestamp: new Date().getTime()
                    });
                    reader.onerror = () => {
                        failedFiles.push(`${file.name}: Failed to read file.`);
                        resolve(null);
                    };
                    reader.readAsDataURL(file);
                });
            });

            Promise.all(promises).then(results => {
                const validMedia = results.filter(result => result !== null);
                if (validMedia.length > 0) {
                    initDB().then(() => {
                        const savePromises = validMedia.map(mediaObj => addMediaToDB(mediaObj));
                        return Promise.all(savePromises);
                    }).then(() => {
                        displayMedia();
                        if (failedFiles.length > 0) {
                            alert(`Some files were uploaded successfully, but errors occurred:\n- ${failedFiles.join('\n- ')}`);
                        } else {
                        }
                    }).catch(err => {
                        console.error('Error saving to IndexedDB:', err);
                        alert('Failed to save media: ' + err);
                    });
                } else if (failedFiles.length > 0) {
                    alert(`No files were uploaded due to errors:\n\n- ${failedFiles.join('\n- ')}`);
                }
            }).catch(err => {
                console.error('Unexpected error during file processing:', err);
                alert('An unexpected error occurred while processing files.');
            });

            fileInput.value = '';
        }

        function displayMedia() {
            const mediaContainer = document.getElementById('mediaContainer');

            loadMediaList().then(mediaList => {
                if (mediaList.length === 0) {
                    mediaContainer.innerHTML = '<p style="text-align: center;color: gray;">No media stored.</p>';
                    return;
                }
                const groupedMedia = {};
                mediaList.forEach(mediaObj => {
                    if (!groupedMedia[mediaObj.date]) {
                        groupedMedia[mediaObj.date] = [];
                    }
                    groupedMedia[mediaObj.date].push(mediaObj);
                });
                const sortedDates = Object.keys(groupedMedia).sort((a, b) => new Date(b) - new Date(a));

                mediaContainer.innerHTML = '';

                sortedDates.forEach(date => {
                    const sortedMedia = groupedMedia[date].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    const dateSection = document.createElement('div');
                    dateSection.className = 'date-section';

                    const dateHeader = document.createElement('h3');
                    dateHeader.className = 'date-header';
                    dateHeader.textContent = formatDate(date);

                    const mediaGrid = document.createElement('div');
                    mediaGrid.className = 'media-grid';

                    sortedMedia.forEach((mediaObj, index) => {
                        const globalIndex = mediaList.findIndex(item => item.id === mediaObj.id);
                        const mediaData = mediaObj.data;
                        const mediaType = mediaData.startsWith('data:image') ? 'img' : 'video';
                        const mediaElement = document.createElement(mediaType);
                        mediaElement.src = mediaData;
                        if (mediaType === 'video') mediaElement.controls = true;
                        mediaElement.onclick = function() {
                            previewMedia(mediaData, mediaType, globalIndex, mediaObj.id, mediaObj.originalName);
                        };

                        const mediaItemContainer = document.createElement('div');
                        mediaItemContainer.className = 'media-item';

                        const iconContainer = document.createElement('div');
                        iconContainer.className = 'icon-container';

                        const downloadLink = document.createElement('a');
                        downloadLink.href = mediaData;
                        downloadLink.download = `BsMstore#${mediaObj.originalName || 'media_' + globalIndex}`;
                        downloadLink.innerHTML = '<i class="fa-solid fa-download"></i>';

                        const deleteButton = document.createElement('button');
                        deleteButton.innerHTML = '<i class="fa-solid fa-circle-minus"></i>';
                        deleteButton.onclick = function(e) {
                            e.stopPropagation();
                            deleteMedia(mediaObj.id);
                        };

                        iconContainer.appendChild(downloadLink);
                        iconContainer.appendChild(deleteButton);

                        mediaItemContainer.appendChild(mediaElement);
                        mediaItemContainer.appendChild(iconContainer);

                        mediaGrid.appendChild(mediaItemContainer);
                    });

                    dateSection.appendChild(dateHeader);
                    dateSection.appendChild(mediaGrid);
                    mediaContainer.appendChild(dateSection);
                });
            }).catch(err => {
                console.error('Error loading media:', err);
                mediaContainer.innerHTML = '<p>Error loading media.</p>';
            });
        }

        function previewMedia(mediaData, mediaType, index, id, originalName) {
            const modal = document.getElementById('previewModal');
            const modalContent = document.getElementById('modalContent');
            const modalIconContainer = document.getElementById('modalIconContainer');
            
            currentMediaIndex = index;
            modalContent.innerHTML = '';
            modalIconContainer.innerHTML = '';

            const mediaElement = document.createElement(mediaType);
            mediaElement.src = mediaData;
            if (mediaType === 'video') mediaElement.controls = true;

            const downloadLink = document.createElement('a');
            downloadLink.href = mediaData;
            downloadLink.download = `BsMstore#${originalName || 'media_' + index}`;
            downloadLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M465-339.5q-7-2.5-13-8.5L308-492q-12-12-11.5-28t11.5-28q12-12 28.5-12.5T365-549l75 75v-286q0-17 11.5-28.5T480-800q17 0 28.5 11.5T520-760v286l75-75q12-12 28.5-11.5T652-548q11 12 11.5 28T652-492L508-348q-6 6-13 8.5t-15 2.5q-8 0-15-2.5ZM240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Z"/></svg>';

            const deleteButton = document.createElement('button');
            deleteButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-120q-33 0-56.5-23.5T200-200v-520q-17 0-28.5-11.5T160-760q0-17 11.5-28.5T200-800h160q0-17 11.5-28.5T400-840h160q17 0 28.5 11.5T600-800h160q17 0 28.5 11.5T800-760q0 17-11.5 28.5T760-720v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM428.5-291.5Q440-303 440-320v-280q0-17-11.5-28.5T400-640q-17 0-28.5 11.5T360-600v280q0 17 11.5 28.5T400-280q17 0 28.5-11.5Zm160 0Q600-303 600-320v-280q0-17-11.5-28.5T560-640q-17 0-28.5 11.5T520-600v280q0 17 11.5 28.5T560-280q17 0 28.5-11.5ZM280-720v520-520Z"/></svg>';
            deleteButton.onclick = function(e) {
                e.stopPropagation();
                deleteMedia(id);
                closeModal();
            };

            modalIconContainer.appendChild(downloadLink);
            modalIconContainer.appendChild(deleteButton);

            modalContent.appendChild(mediaElement);
            modal.classList.add('show');
        }

        function closeModal() {
            const modal = document.getElementById('previewModal');
            modal.classList.remove('show');
            currentMediaIndex = -1;
        }

        function deleteMedia(id) {
            deleteMediaFromDB(id).then(() => {
                displayMedia();
            }).catch(err => {
                console.error('Error deleting media:', err);
                alert('Failed to delete media: ' + err);
            });
        }

        function navigateMedia(direction) {
            loadMediaList().then(mediaList => {
                if (mediaList.length === 0) return;

                currentMediaIndex += direction;

                if (currentMediaIndex < 0) {
                    currentMediaIndex = mediaList.length - 1;
                } else if (currentMediaIndex >= mediaList.length) {
                    currentMediaIndex = 0;
                }

                const mediaObj = mediaList[currentMediaIndex];
                const mediaData = mediaObj.data;
                const mediaType = mediaData.startsWith('data:image') ? 'img' : 'video';
                previewMedia(mediaData, mediaType, currentMediaIndex, mediaObj.id, mediaObj.originalName);
            }).catch(err => {
                console.error('Error navigating media:', err);
                alert('Error navigating media: ' + err);
            });
        }
        window.onload = function() {
            initDB().then(() => {
                displayMedia();
            }).catch(err => {
                console.error('Error initializing IndexedDB:', err);
                document.getElementById('mediaContainer').innerHTML = '<p>Error initializing storage.</p>';
            });
        };

        document.addEventListener("DOMContentLoaded", () => {
            const customMenu = document.querySelector(".custom-menu");

            document.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                if (customMenu) {
                    customMenu.style.display = "block";
                    customMenu.style.top = `${event.pageY}px`;
                    customMenu.style.left = `${event.pageX}px`;
                }
            });

            document.addEventListener("click", () => {
                if (customMenu) {
                    customMenu.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
