<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BsPsgenerater</title> <link rel="icon" type="image/x-icon" href="https://i.ibb.co/Fm5hs43/passgene.png"> <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap'); * { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; box-sizing: border-box;scrollbar-width: thin; scrollbar-color: gray black; -webkit-tap-highlight-color: transparent; } body { background: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; letter-spacing: 0.3px; user-select: none; } .container { width: 100%; max-width: 420px; padding: 15px 10px; } h1 { text-align: center; font-size: 28px; font-weight: 700; color: blue; margin-bottom: 28px; letter-spacing: 0.5px; } .card { border-radius: 25px; padding: 10px 0 0 0; margin-bottom: 0; position: sticky; top: 0px; z-index: 1000; background: linear-gradient(180deg, black 60%, transparent); } .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; } label { color: #aaa; font-size: 14px; font-weight: 500; } input[type="number"], input[type="text"], input[type="password"] { border: none; color: #fff; border-radius: 9999px; padding: 10px 16px; font-size: 18px; outline: none; width: 100%; text-align: center; transition: border-color 0.2s; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0.1); } input[type="number"] { width: 90px; text-align: center; } h2 { font-size: 25px; font-weight: 600; color: #0040ff; margin: 0; } .btn { background: blue; color: #fff; border: none; border-radius: 999px; padding: 12px; font-size: 16px; font-weight: 400; cursor: pointer; width: 100%; transition: background 0.2s; } .btn-secondary { background: rgb(59 59 59); } .btn-group { display: flex; gap: 10px; margin-top: 6px; } .btn-group .btn { flex: 1; } .password-preview { display: none; margin-top: 16px; border-radius: 14px; padding: 14px 0; word-break: break-all; font-size: 25px; font-weight: 600; text-align: center; user-select: text; letter-spacing: 1px; } .password-preview.visible { display: block; } .section-title { text-align: center; color: blue; font-size: 20px; font-weight: 600; margin: 28px 0 16px; } #savedPasswords { display: flex; flex-direction: column; gap: 12px; } .password-item { background: rgb(26 26 26); border-radius: 25px; padding: 15px; position: relative; } .item-header { display: flex; justify-content: space-between; align-items:center; gap: 10px; } .item-title { font-size: 15px; font-weight: 600; color: #fff; width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .item-password { font-size: 14px; color: #aaa; margin-top: 6px; word-break: break-all; user-select: text; font-family: monospace; letter-spacing: 0.5px; } .item-actions { display: flex; gap: 6px; flex-shrink: 0; } .icon-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; } .icon-btn svg { width: 18px; height: 18px; fill: currentColor; } button.icon-btn.delete { background: red; } .empty-state { text-align: center; color: #666; font-size: 14px; padding: 30px 10px; } .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; } .modal.open { display: flex; } .modal-content { text-align: center; z-index: 100000000000000; width: 85%; max-width: 400px; padding: 15px; background: #1c1c1e; border-radius: 35px; border: 0.5px solid rgba(255, 255, 255, 0.1); } .modal-content h3 { margin-bottom: 15px; color: white; font-size: 20px; font-weight: 500; } .modal-content input { margin-bottom: 13px; text-align: center; font-size: 17px; padding: 12px; background: #3b3b3b; border-radius: 999px; color: white; font-weight: 400; border: none; } .modal-content .btn { margin-top: 8px; } .modal-actions { display: flex; gap: 10px; margin-top: -7px; } .modal-actions .btn { flex: 1; } .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(0px); background: blue; color: #fff; padding: 12px; border-radius: 9999px; font-size: 15px; font-weight: 500; z-index: 2000; opacity: 0; pointer-events: none; } .toast.show { opacity: 1; } .mode-tabs { display: flex; background: rgb(27 27 27); border-radius: 9999px; padding: 4px; margin-bottom: 18px; } .mode-tab { flex: 1; text-align: center; padding: 10px; border-radius: 9999px; font-size: 14px; font-weight: 600; cursor: pointer; color: #888; transition: all 0.2s; } .mode-tab.active { background: blue; color: #fff; } </style> </head> <body> <div class="container"> <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;"> <h2>BsPsgenerater</h2> <a href="https://blackswan19.github.io/bscrop/termsofuse" style="background: blue; color: white; border-radius: 999px; text-decoration: none; font-size: 15px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M10.95,13.07L9.36,11.47q-0.22-0.22-0.52-0.23T8.3,11.47T8.07,12.01T8.3,12.54l2.01,2.03q0.27,0.27 0.63,0.27t0.63-0.27l4.14-4.14q0.22-0.22 0.23-0.53T15.73,9.36T15.19,9.13T14.66,9.36l-3.71,3.71Zm0.74,8.28q-0.15-0.02-0.29-0.07q-3.16-1.13-5.03-3.99T4.5,11.1V6.6q0-0.57 0.33-1.02T5.68,4.91l5.69-2.12Q11.69,2.67 12,2.67t0.63,0.12l5.69,2.12q0.52,0.21 0.85,0.66T19.5,6.6v4.5q0,3.32-1.87,6.18T12.6,21.27q-0.14,0.05-0.29,0.07T12,21.37t-0.31-0.02Z"/></svg> </a> </div> <div class="card"> <div class="mode-tabs"> <div class="mode-tab active" id="tabGenerate" onclick="switchMode('generate')">Generate</div> <div class="mode-tab" id="tabManual" onclick="switchMode('manual')">Add Manual</div> </div> <!-- GENERATE MODE --> <div id="generateMode"> <div class="row"> <label for="length">Password Length</label> <input type="number" id="length" min="4" max="64" value="12"> </div> <button class="btn" onclick="generatePassword()">Generate Password</button> <div class="password-preview" id="passwordPreview"></div> <div class="btn-group" id="afterGenerateActions" style="display:none; margin-top:12px;"> <button class="btn btn-secondary" onclick="copyCurrent()">Copy</button> <button class="btn" onclick="openSaveModal()">Save</button> </div> </div> <!-- MANUAL MODE --> <div id="manualMode" style="display:none;"> <input type="text" id="manualTitle" placeholder="Enter title" style="margin-bottom:12px;"> <input type="text" id="manualPassword" placeholder="Enter password"> <button class="btn" style="margin-top:12px;" onclick="saveManualPassword()">Save Password</button> </div> </div> <h2 class="section-title">Saved Passwords</h2> <div id="savedPasswords"></div> </div> <!-- Save / Edit Modal --> <div class="modal" id="saveModal"> <div class="modal-content"> <h3 id="modalTitle">Save Password</h3> <input type="text" id="titleInput" placeholder="Enter title"> <input type="text" id="passwordInput" placeholder="Password" style="display:none;"> <div class="modal-actions"> <button class="btn btn-secondary" onclick="closeModal()">Cancel</button> <button class="btn" id="modalSaveBtn" onclick="confirmSave()">Save</button> </div> </div> </div> <div class="toast" id="toast">Password copied!</div>
<script>
        let currentPassword = '';
        let editIndex = -1;
        const icons = {
            copy: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M9.06,17.5q-0.76,0-1.28-0.52T7.25,15.69V4.31q0-0.76 0.52-1.28T9.06,2.5h8.38q0.76,0 1.28,0.52t0.52,1.28V15.69q0,0.76-0.52,1.28T17.44,17.5H9.06ZM5.56,21Q4.8,21 4.28,20.47T3.75,19.19V7.06q0-0.32 0.22-0.53T4.5,6.31T5.03,6.52T5.25,7.06V19.19q0,0.12 0.1,0.21t0.21,0.1h9.13q0.32,0 0.53,0.22t0.22,0.53t-0.22,0.53T14.69,21H5.56Z"/></svg>`,
            edit: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M4.4,20.5q-0.38,0-0.64-0.26T3.5,19.6V17.86q0-0.37 0.14-0.7t0.39-0.58L16.69,3.93q0.23-0.21 0.5-0.32T17.77,3.5t0.58,0.11t0.5,0.34l1.22,1.24Q20.3,5.4 20.4,5.68t0.1,0.57q0,0.3-0.1,0.58t-0.33,0.5L7.41,19.97q-0.25,0.25-0.58,0.39T6.14,20.5H4.4ZM17.55,7.69L19,6.26L17.74,5L16.31,6.45l1.25,1.25Z"/></svg>`,
            delete: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M13.83,13.05l2.07,2.07q0.21,0.21 0.52,0.21t0.53-0.21t0.22-0.53t-0.22-0.53L14.88,12l2.07-2.07q0.21-0.21 0.21-0.52T16.95,8.87T16.43,8.66T15.9,8.87l-2.07,2.07L11.75,8.87q-0.21-0.21-0.52-0.21T10.7,8.87T10.48,9.4T10.7,9.93L12.77,12L10.7,14.07q-0.21,0.21-0.21,0.52t0.21,0.53t0.53,0.22t0.53-0.22l2.07-2.07ZM9.09,19.5q-0.43,0-0.81-0.19T7.64,18.79L3.32,13.09Q2.95,12.61 2.95,12t0.37-1.09L7.64,5.21Q7.89,4.88 8.27,4.69T9.09,4.5H19.69q0.75,0 1.28,0.53T21.5,6.31V17.69q0,0.75-0.53,1.28T19.69,19.5H9.09Z"/></svg>`
        };
        window.onload = () => {
            displaySavedPasswords();
        };
        function switchMode(mode) {
            const gen = document.getElementById('generateMode');
            const man = document.getElementById('manualMode');
            const tabG = document.getElementById('tabGenerate');
            const tabM = document.getElementById('tabManual');
            if (mode === 'generate') {
                gen.style.display = 'block';
                man.style.display = 'none';
                tabG.classList.add('active');
                tabM.classList.remove('active');
            } else {
                gen.style.display = 'none';
                man.style.display = 'block';
                tabG.classList.remove('active');
                tabM.classList.add('active');
            }
        }
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value) || 12;
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}';
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            currentPassword = password;
            const preview = document.getElementById('passwordPreview');
            preview.textContent = password;
            preview.classList.add('visible');
            document.getElementById('afterGenerateActions').style.display = 'flex';
        }
        function copyCurrent() {
            if (!currentPassword) return;
            copyToClipboard(currentPassword);
        }
        function openSaveModal() {
            editIndex = -1;
            document.getElementById('modalTitle').textContent = 'Save Password';
            document.getElementById('titleInput').value = '';
            document.getElementById('passwordInput').style.display = 'none';
            document.getElementById('modalSaveBtn').textContent = 'Save';
            document.getElementById('saveModal').classList.add('open');
            document.getElementById('titleInput').focus();
        }
        function saveManualPassword() {
            const title = document.getElementById('manualTitle').value.trim();
            const password = document.getElementById('manualPassword').value.trim();
            if (!title || !password) {
                showToast('Fill both fields');
                return;
            }
            savePassword(title, password);
            document.getElementById('manualTitle').value = '';
            document.getElementById('manualPassword').value = '';
            showToast('Password saved!');
        }
        function confirmSave() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                showToast('Enter a title');
                return;
            }
            if (editIndex === -1) {
                savePassword(title, currentPassword);
                document.getElementById('passwordPreview').classList.remove('visible');
                document.getElementById('afterGenerateActions').style.display = 'none';
                currentPassword = '';
            } else {
                const password = document.getElementById('passwordInput').value.trim();
                if (!password) {
                    showToast('Password cannot be empty');
                    return;
                }
                updatePassword(editIndex, title, password);
            }
            closeModal();
        }
        function closeModal() {
            document.getElementById('saveModal').classList.remove('open');
            editIndex = -1;
        }
        function getPasswords() {
            return JSON.parse(localStorage.getItem('passwords')) || [];
        }
        function setPasswords(list) {
            localStorage.setItem('passwords', JSON.stringify(list));
        }
        function savePassword(title, password) {
            const list = getPasswords();
            list.push({ title, password });
            setPasswords(list);
            displaySavedPasswords();
            showToast('Password saved!');
        }
        function updatePassword(index, title, password) {
            const list = getPasswords();
            list[index] = { title, password };
            setPasswords(list);
            displaySavedPasswords();
            showToast('Password updated!');
        }
        function deletePassword(index) {
            const list = getPasswords();
            list.splice(index, 1);
            setPasswords(list);
            displaySavedPasswords();
            showToast('Password deleted');
        }
        function editPassword(index) {
            const list = getPasswords();
            const item = list[index];
            editIndex = index;

            document.getElementById('modalTitle').textContent = 'Edit Password';
            document.getElementById('titleInput').value = item.title;
            const passInput = document.getElementById('passwordInput');
            passInput.style.display = 'block';
            passInput.value = item.password;
            document.getElementById('modalSaveBtn').textContent = 'Update';
            document.getElementById('saveModal').classList.add('open');
            document.getElementById('titleInput').focus();
        }
        function displaySavedPasswords() {
            const container = document.getElementById('savedPasswords');
            const list = getPasswords();
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">No saved passwords yet</div>';
                return;
            }
            container.innerHTML = '';
            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'password-item';
                div.innerHTML = `
                    <div class="item-header">
                        <div>
                            <div class="item-title">${escapeHtml(item.title)}</div>
                            <div class="item-password">${escapeHtml(item.password)}</div>
                        </div>
                        <div class="item-actions">
                            <button class="icon-btn" title="Copy" onclick="copyToClipboard('${escapeAttr(item.password)}')">${icons.copy}</button>
                            <button class="icon-btn" title="Edit" onclick="editPassword(${index})">${icons.edit}</button>
                            <button class="icon-btn delete" title="Delete" onclick="deletePassword(${index})">${icons.delete}</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('Password copied!'));
            } else {
                const temp = document.createElement('input');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast('Password copied!');
            }
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }
        function escapeAttr(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
