<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BsPsgenerater</title> <link rel="icon" type="image/x-icon" href="https://i.ibb.co/Fm5hs43/passgene.png"> <style> @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap'); * { margin: 0; padding: 0; box-sizing: border-box;scrollbar-width: thin; scrollbar-color: gray black; font-family: "Red Hat Display", sans-serif; -webkit-tap-highlight-color: transparent; } body { background: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 10px; letter-spacing: 0.3px; user-select: none; } .container { width: 100%; max-width: 420px; } h1 { text-align: center; font-size: 28px; font-weight: 700; color: blue; margin-bottom: 28px; letter-spacing: 0.5px; } .card { border-radius: 25px; padding: 10px 0 0 0; margin-bottom: 0; position: sticky; top: 0px; z-index: 1000; background: linear-gradient(180deg, black 60%, transparent); } .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; } label { color: #aaa; font-size: 14px; font-weight: 500; } input[type="number"], input[type="text"], input[type="password"] { border: none; color: #fff; border-radius: 9999px; padding: 10px 16px; font-size: 18px; outline: none; width: 100%; text-align: center; transition: border-color 0.2s; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); font-weight: 200; border: 0.5px solid rgba(255, 255, 255, 0.1); } input[type="number"] { width: 90px; text-align: center; } .btn { background: blue; color: #fff; border: none; border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; } .btn-secondary { background: rgb(39 39 39); } .btn-group { display: flex; gap: 10px; margin-top: 6px; } .btn-group .btn { flex: 1; } .password-preview { display: none; margin-top: 16px; border-radius: 14px; padding: 14px 0; word-break: break-all; font-size: 25px; font-weight: 600; text-align: center; user-select: text; letter-spacing: 1px; } .password-preview.visible { display: block; } .section-title { text-align: center; color: blue; font-size: 20px; font-weight: 600; margin: 28px 0 16px; } #savedPasswords { display: flex; flex-direction: column; gap: 12px; } .password-item { background: rgb(26 26 26); border-radius: 25px; padding: 15px; position: relative; } .item-header { display: flex; justify-content: space-between; align-items:center; gap: 10px; } .item-title { font-size: 15px; font-weight: 600; color: #fff; width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .item-password { font-size: 14px; color: #aaa; margin-top: 6px; word-break: break-all; user-select: text; font-family: monospace; letter-spacing: 0.5px; } .item-actions { display: flex; gap: 6px; flex-shrink: 0; } .icon-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; } .icon-btn svg { width: 18px; height: 18px; fill: currentColor; } button.icon-btn.delete { background: red; } .empty-state { text-align: center; color: #666; font-size: 14px; padding: 30px 10px; } .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; } .modal.open { display: flex; } .modal-content { background: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 15px; width: 100%; max-width: 340px; text-align: center; z-index: 100000000000000; } .modal-content h3 { font-size: 18px; margin-bottom: 18px; color: #fff; } .modal-content input { margin-bottom: 5px; text-align: center; font-size: 18px; padding: 10px; background: #e3e3e4; border-radius: 10px; color: black; font-weight: 500; } .modal-content .btn { margin-top: 8px; } .modal-actions { display: flex; gap: 10px; } .modal-actions .btn { flex: 1; } .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(0px); background: blue; color: #fff; padding: 12px; border-radius: 9999px; font-size: 15px; font-weight: 500; z-index: 2000; opacity: 0; pointer-events: none; } .toast.show { opacity: 1; } .mode-tabs { display: flex; background: rgba(255, 255, 255, 0.06); border-radius: 9999px; padding: 4px; margin-bottom: 18px; } .mode-tab { flex: 1; text-align: center; padding: 10px; border-radius: 9999px; font-size: 14px; font-weight: 600; cursor: pointer; color: #888; transition: all 0.2s; } .mode-tab.active { background: blue; color: #fff; } </style> </head> <body> <div class="container"> <h1>BsPsgenerater</h1> <div class="card"> <div class="mode-tabs"> <div class="mode-tab active" id="tabGenerate" onclick="switchMode('generate')">Generate</div> <div class="mode-tab" id="tabManual" onclick="switchMode('manual')">Add Manual</div> </div> <!-- GENERATE MODE --> <div id="generateMode"> <div class="row"> <label for="length">Password Length</label> <input type="number" id="length" min="4" max="64" value="12"> </div> <button class="btn" onclick="generatePassword()">Generate Password</button> <div class="password-preview" id="passwordPreview"></div> <div class="btn-group" id="afterGenerateActions" style="display:none; margin-top:12px;"> <button class="btn btn-secondary" onclick="copyCurrent()">Copy</button> <button class="btn" onclick="openSaveModal()">Save</button> </div> </div> <!-- MANUAL MODE --> <div id="manualMode" style="display:none;"> <input type="text" id="manualTitle" placeholder="Enter title" style="margin-bottom:12px;"> <input type="text" id="manualPassword" placeholder="Enter password"> <button class="btn" style="margin-top:12px;" onclick="saveManualPassword()">Save Password</button> </div> </div> <h2 class="section-title">Saved Passwords</h2> <div id="savedPasswords"></div> </div> <!-- Save / Edit Modal --> <div class="modal" id="saveModal"> <div class="modal-content"> <h3 id="modalTitle">Save Password</h3> <input type="text" id="titleInput" placeholder="Enter title"> <input type="text" id="passwordInput" placeholder="Password" style="display:none;"> <div class="modal-actions"> <button class="btn btn-secondary" onclick="closeModal()">Cancel</button> <button class="btn" id="modalSaveBtn" onclick="confirmSave()">Save</button> </div> </div> </div> <div class="toast" id="toast">Password copied!</div>
<script>
        let currentPassword = '';
        let editIndex = -1;
        const icons = {
            copy: `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`,
            edit: `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`,
            delete: `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`
        };
        window.onload = () => {
            displaySavedPasswords();
        };
        function switchMode(mode) {
            const gen = document.getElementById('generateMode');
            const man = document.getElementById('manualMode');
            const tabG = document.getElementById('tabGenerate');
            const tabM = document.getElementById('tabManual');
            if (mode === 'generate') {
                gen.style.display = 'block';
                man.style.display = 'none';
                tabG.classList.add('active');
                tabM.classList.remove('active');
            } else {
                gen.style.display = 'none';
                man.style.display = 'block';
                tabG.classList.remove('active');
                tabM.classList.add('active');
            }
        }
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value) || 12;
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}';
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            currentPassword = password;
            const preview = document.getElementById('passwordPreview');
            preview.textContent = password;
            preview.classList.add('visible');
            document.getElementById('afterGenerateActions').style.display = 'flex';
        }
        function copyCurrent() {
            if (!currentPassword) return;
            copyToClipboard(currentPassword);
        }
        function openSaveModal() {
            editIndex = -1;
            document.getElementById('modalTitle').textContent = 'Save Password';
            document.getElementById('titleInput').value = '';
            document.getElementById('passwordInput').style.display = 'none';
            document.getElementById('modalSaveBtn').textContent = 'Save';
            document.getElementById('saveModal').classList.add('open');
            document.getElementById('titleInput').focus();
        }
        function saveManualPassword() {
            const title = document.getElementById('manualTitle').value.trim();
            const password = document.getElementById('manualPassword').value.trim();
            if (!title || !password) {
                showToast('Fill both fields');
                return;
            }
            savePassword(title, password);
            document.getElementById('manualTitle').value = '';
            document.getElementById('manualPassword').value = '';
            showToast('Password saved!');
        }
        function confirmSave() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                showToast('Enter a title');
                return;
            }
            if (editIndex === -1) {
                savePassword(title, currentPassword);
                document.getElementById('passwordPreview').classList.remove('visible');
                document.getElementById('afterGenerateActions').style.display = 'none';
                currentPassword = '';
            } else {
                const password = document.getElementById('passwordInput').value.trim();
                if (!password) {
                    showToast('Password cannot be empty');
                    return;
                }
                updatePassword(editIndex, title, password);
            }
            closeModal();
        }
        function closeModal() {
            document.getElementById('saveModal').classList.remove('open');
            editIndex = -1;
        }
        function getPasswords() {
            return JSON.parse(localStorage.getItem('passwords')) || [];
        }
        function setPasswords(list) {
            localStorage.setItem('passwords', JSON.stringify(list));
        }
        function savePassword(title, password) {
            const list = getPasswords();
            list.push({ title, password });
            setPasswords(list);
            displaySavedPasswords();
            showToast('Password saved!');
        }
        function updatePassword(index, title, password) {
            const list = getPasswords();
            list[index] = { title, password };
            setPasswords(list);
            displaySavedPasswords();
            showToast('Password updated!');
        }
        function deletePassword(index) {
            const list = getPasswords();
            list.splice(index, 1);
            setPasswords(list);
            displaySavedPasswords();
            showToast('Password deleted');
        }
        function editPassword(index) {
            const list = getPasswords();
            const item = list[index];
            editIndex = index;

            document.getElementById('modalTitle').textContent = 'Edit Password';
            document.getElementById('titleInput').value = item.title;
            const passInput = document.getElementById('passwordInput');
            passInput.style.display = 'block';
            passInput.value = item.password;
            document.getElementById('modalSaveBtn').textContent = 'Update';
            document.getElementById('saveModal').classList.add('open');
            document.getElementById('titleInput').focus();
        }
        function displaySavedPasswords() {
            const container = document.getElementById('savedPasswords');
            const list = getPasswords();
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">No saved passwords yet</div>';
                return;
            }
            container.innerHTML = '';
            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'password-item';
                div.innerHTML = `
                    <div class="item-header">
                        <div>
                            <div class="item-title">${escapeHtml(item.title)}</div>
                            <div class="item-password">${escapeHtml(item.password)}</div>
                        </div>
                        <div class="item-actions">
                            <button class="icon-btn" title="Copy" onclick="copyToClipboard('${escapeAttr(item.password)}')">${icons.copy}</button>
                            <button class="icon-btn" title="Edit" onclick="editPassword(${index})">${icons.edit}</button>
                            <button class="icon-btn delete" title="Delete" onclick="deletePassword(${index})">${icons.delete}</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('Password copied!'));
            } else {
                const temp = document.createElement('input');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast('Password copied!');
            }
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }
        function escapeAttr(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
